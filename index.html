/* ---------- eljárásos kő/beton textúra (canvasból, önálló) ---------- */
function _cv(s){ const c = document.createElement('canvas'); c.width = c.height = s; return c; }
function _fin(c){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); return t; }
function stoneTex(){
  const s = 512, c = _cv(s), g = c.getContext('2d');
  g.fillStyle = '#3f3a32'; g.fillRect(0, 0, s, s);                 // sötét fuga (hézag)
  const cols = ['#9a9284','#8a8276','#b0a897','#7c7468','#6b6459','#a89a80','#918d7b','#7f8a86','#8c6f52'];
  const cell = 92;
  for (let gy = -1; gy * cell < s + cell; gy++) {
    for (let gx = -1; gx * cell < s + cell; gx++) {
      const cxp = gx*cell + cell*0.5 + (Math.random()-0.5)*cell*0.55;
      const cyp = gy*cell + cell*0.5 + (Math.random()-0.5)*cell*0.55;
      const n = 6 + (Math.random()*3|0), rad = cell*(0.52 + Math.random()*0.26);
      g.beginPath();
      for (let k = 0; k < n; k++) {
        const a = (k/n)*Math.PI*2 + (Math.random()-0.5)*0.5, r = rad*(0.72 + Math.random()*0.45);
        const x = cxp + Math.cos(a)*r, y = cyp + Math.sin(a)*r*0.86;
        k ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath(); g.fillStyle = cols[(Math.random()*cols.length)|0]; g.fill();
      g.save(); g.clip();                                          // relief a kövön belül
      const rg = g.createRadialGradient(cxp-rad*0.3, cyp-rad*0.38, rad*0.1, cxp, cyp, rad*1.15);
      rg.addColorStop(0, 'rgba(255,255,255,0.16)'); rg.addColorStop(0.6, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.34)');
      g.fillStyle = rg; g.fillRect(cxp-rad*1.6, cyp-rad*1.6, rad*3.2, rad*3.2);
      g.restore();
    }
  }
  return _fin(c);
}
function concreteTex(){
  const s = 512, c = _cv(s), g = c.getContext('2d');
  g.fillStyle = '#cbc8c0'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 48; i++) { const x = Math.random()*s, y = Math.random()*s, r = 18 + Math.random()*80, light = Math.random() < 0.5;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, light ? 'rgba(226,224,216,0.12)' : 'rgba(150,146,137,0.12)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(x-r, y-r, 2*r, 2*r); }
  const id = g.getImageData(0, 0, s, s), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random()*24-12)|0; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(id, 0, 0);
  return _fin(c);
}

// mesh-építő nyers pozíciótömbből; uvMode: null | 'wall'(x,y) | 'ground'(x,z)
function mkMesh(posArr, mat, uvMode, name) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.computeVertexNormals();
  if (uvMode) { const t = 1.1, uv = new Float32Array((posArr.length / 3) * 2);
    for (let i = 0, j = 0; i < posArr.length; i += 3, j += 2) {
      uv[j] = posArr[i] / t; uv[j + 1] = (uvMode === 'wall' ? posArr[i + 1] : posArr[i + 2]) / t;
    }
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }
  geo.computeBoundingSphere();
  const m = new THREE.Mesh(geo, mat); m.name = name || 'mesh';
  m.castShadow = m.receiveShadow = true; world.add(m); return m;
}

// DAE Z-up (x, y, z) → three (x, z, −y)
async function loadClass(cls) {
  const info = manifest.classes[cls];
  if (!info) return null;
  const buf = await (await fetch(info.file)).arrayBuffer();
  const src = new Float32Array(buf);
  const pos = new Float32Array(src.length);
  for (let i = 0; i < src.length; i += 3) {
    pos[i]     = src[i];
    pos[i + 1] = src[i + 2];
    pos[i + 2] = -src[i + 1];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  if (TILE[cls]) {                                   // sík vetítésű UV a kő/beton textúrához
    const t = TILE[cls], uv = new Float32Array((pos.length / 3) * 2);
    for (let i = 0, j = 0; i < pos.length; i += 3, j += 2) {
      if (cls === 'lugasfal') { uv[j] = pos[i] / t; uv[j + 1] = pos[i + 1] / t; }   // fal: x, y(fel)
      else { uv[j] = pos[i] / t; uv[j + 1] = pos[i + 2] / t; }                       // vízszintes: x, z
    }
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }
  geo.computeBoundingSphere();
  // DoubleSide: a SketchUp-lapok normálisai vegyesek, egyoldalas rajzolásnál eltűnnének
  const mat = info.color
    ? new THREE.MeshLambertMaterial({ name: cls, color: info.color, side: THREE.DoubleSide })
    : (MAT[cls] || MAT.tomeg);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = cls;
  mesh.renderOrder = 0;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  world.add(mesh);
  return mesh;
}

/* ---------- panoráma: equirect (lat-long) környezeti háttér, mint Blenderben a World HDRI.
   A kép közepe a lejtőirányba (+X = DK, Petőfi utca felé) néz — így a lugas balra,
   a fenyők jobbra esnek, és látszik, mit takarnak ki a fák. ---------- */
function panoramaTex() {
  const W = 4096, H = 2048, HOR = H * 0.5;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  let s = 1; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;   // determinisztikus

  g.fillStyle = '#79B7E3'; g.fillRect(0, 0, W, HOR);        // egyszínű kék ég, végig a tetejéig

  const grd = g.createLinearGradient(0, HOR, 0, H);
  grd.addColorStop(0, '#8CA372'); grd.addColorStop(1, '#5F7350');
  g.fillStyle = grd; g.fillRect(0, HOR, W, H - HOR);

  // Zónák a látómezőben (a kép közepe = +X = lejtőirány, DK):
  //   BAL = hegy / magasabb domb · ELÖL = kisebb dombok · JOBB = fák, dombok, 2-3 ház
  const BAL = 0.25, ELOL = 0.5, JOBB = 0.75;
  const zw = (u, c, w) => { let d = Math.abs(u - c); d = Math.min(d, 1 - d); return Math.exp(-(d * d) / (2 * w * w)); };

  function ridge(baseY, ampFn, color, f1, f2, ph) {               // domblánc, zónánként más magassággal
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) {
      const u = x / W, a = u * Math.PI * 2;
      const n = Math.sin(a * f1 + ph) * 0.6 + Math.sin(a * f2 + ph * 1.7) * 0.3 + Math.sin(a * 13 + ph) * 0.1;
      g.lineTo(x, baseY - ampFn(u) * (0.55 + 0.45 * n));
    }
    g.lineTo(W, H); g.closePath(); g.fillStyle = color; g.fill();
  }

  ridge(HOR + 6, (u) => 26 + 175 * zw(u, BAL, 0.115) + 34 * zw(u, JOBB, 0.16),
        '#BAC9D2', 3, 5, 0.4);                                    // hegy balra (messzi, kékes)
  ridge(HOR + 22, (u) => 24 + 62 * zw(u, BAL, 0.17) + 40 * zw(u, JOBB, 0.19),
        '#AEBFB2', 4, 7, 1.9);                                    // középső dombsor
  ridge(HOR + 40, (u) => 18 + 20 * zw(u, ELOL, 0.16) + 26 * zw(u, JOBB, 0.22),
        '#A4B695', 5, 9, 3.1);                                    // elöl alacsony dombok

  for (let i = 0; i < 3; i++) {                                   // 2-3 ház jobbra
    const u = JOBB + (i - 1) * 0.055 + (rnd() - 0.5) * 0.02;
    const x = u * W, y = HOR + 62 + rnd() * 26, w = 42 + rnd() * 26, h = 22 + rnd() * 10;
    g.fillStyle = '#EAE4D8'; g.fillRect(x, y, w, h);
    g.fillStyle = '#BC8A76';                                      // cseréptető
    g.beginPath(); g.moveTo(x - 5, y); g.lineTo(x + w + 5, y); g.lineTo(x + w / 2, y - 15); g.closePath(); g.fill();
  }

  for (let i = 0; i < 520; i++) {                                 // fasor — jobbra sűrűbb
    const u = rnd();
    if (rnd() > 0.30 + 0.70 * zw(u, JOBB, 0.22)) continue;
    const x = u * W, y = HOR + 46 + rnd() * 78, r = 7 + rnd() * 17;
    g.fillStyle = ['#93A785', '#A0B291', '#899E7C'][(rnd() * 3) | 0];
    g.beginPath(); g.ellipse(x, y, r, r * 0.82, 0, 0, Math.PI * 2); g.fill();
  }

  // légperspektíva: lágyan elúszó pára — felül 0 átlátszatlansággal, hogy az ég
  // egyszínű maradjon és sehol ne legyen éles vonal
  const haze = g.createLinearGradient(0, HOR - 210, 0, HOR + 230);
  haze.addColorStop(0,    'rgba(226,240,247,0)');
  haze.addColorStop(0.42, 'rgba(226,240,247,0.50)');
  haze.addColorStop(0.55, 'rgba(226,240,247,0.60)');
  haze.addColorStop(1,    'rgba(226,240,247,0.08)');
  g.fillStyle = haze; g.fillRect(0, HOR - 210, W, 440);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.mapping = THREE.EquirectangularReflectionMapping;
  return t;
}

/** A lomb állapota adott hónapban: {van, szin} */

  if (f.orokzold) return { van: true, szin: null };
  const [ki, oszTol, hullas] = f.lomb;

  if (m < ki + 0.6) {                               // friss, világosabb tavaszi lomb
    _c1.set(f.nyar); _c2.copy(_c1).lerp(new THREE.Color('#FFFFFF'), 0.22);
    return { van: true, szin: '#' + _c2.getHexString() };
  }

  const t = Math.min(1, (m - oszTol) / Math.max(0.1, hullas - oszTol - 0.3));

  plantGroup.children.forEach((g) => {
    if (g.type !== 'Group') return;
    const sp = g.userData.species, f = PHENO[sp] || {};
    // akinek saját évszak-modellje van, annak a lombszínét/lombhullását a modell hordozza —
    // csak a virág/termés időzítését tesszük rá (a nyári alapmodellbe be van sütve a virág)
    const sajatEvszak = !!(SPECIES[sp] && SPECIES[sp].seasons);
    const leaf = sajatEvszak ? { van: true, szin: null } : leafState(sp, month);
    const virag = f.virag && inWindow(month, f.virag[0], f.virag[1]);
    const termes = f.termes && inWindow(month, f.termes[0], f.termes[1]);
    g.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mn = o.material.name || '';
      if (/virag/i.test(mn)) { o.visible = !!virag; return; }
      if (/termes/i.test(mn)) { o.visible = !!termes; return; }
      if (/lomb|korona|cserje|gyuru|emelet|kup/i.test(mn)) {
        o.visible = leaf.van;
        if (leaf.szin) {
          if (!o.material.userData.alapszin) o.material.userData.alapszin = o.material.color.getHex();
          const sotet = /arnyek/i.test(mn);

  Object.entries(manifest.classes).forEach(([cls, info]) => {
    if (info.ablak && meshes[cls]) meshes[cls].visible = inWindow(month, info.ablak[0], info.ablak[1]);
  });
  objGroup.traverse((m) => { if (m.isMesh && m.userData.ablak) m.visible = inWindow(month, m.userData.ablak[0], m.userData.ablak[1]); });
  tokGroup.children.forEach((m) => { if (m.userData.ablak) m.visible = inWindow(month, m.userData.ablak[0], m.userData.ablak[1]); });

function makePlantGroup(p, i, g0, evszak, h, d) {
  const key = p.species;
  const raw = makeSpecies(key, { growth: g0, seed: i * 3.7 + 1, h: p.h, d: p.d, evszak });
  // a SketchUp-beli valódi állás; ha nincs, aranyszög-szórás (hogy a fák ne legyenek egyformák)
  raw.rotation.y = (p.rot !== undefined) ? p.rot : (i * 137.5 * Math.PI) / 180;
  const g = flatten(raw, key);
  g.position.set(p.x, p.base, -p.y);

  // vágósíkok (saját anyagmásolaton, hogy más fát ne érintsen):
  //  - letört csúcs: a modell felső része eltűnik

  const felul = p.letort ? new THREE.Plane(new THREE.Vector3(0, -1, 0), p.base + h * (1 - p.letort)) : null;
  const nyir = SPECIES[key] && SPECIES[key].felnyirva;
  const alul = nyir ? new THREE.Plane(new THREE.Vector3(0, 1, 0), -(p.base + nyir)) : null;
  if (felul || alul) {
    g.traverse((m) => { if (!m.isMesh) return;
      const sikok = [felul, /^lomb/i.test(m.material.name || '') ? alul : null].filter(Boolean);
      if (!sikok.length) return;

    if (p.letort) hMutat = h * (1 - p.letort);

/* ---------- évszakváltás lágy átúsztatással ----------

function crossfadeSeason(ujEvszak, growth) {
  fadeLezar();                                               // előző átúsztatás lezárása

  PLANTS.forEach((p, i) => {
    const spec = SPECIES[p.species];
    if (!spec || !spec.seasons) return;                      // csak évszak-modelles fajták
    // minden ide tartozó régi példány (ha maradt volna korábbról, az is kikerül)
    const regiek = plantGroup.children.filter((c) => c.type === 'Group' && c.userData._pi === i);
    if (!regiek.length) return;
    regiek.slice(0, -1).forEach((r) => plantGroup.remove(r));
    const regi = regiek[regiek.length - 1];
    const g0 = MEGLEVO.has(p.species) ? 1 : growth;
    const k = 0.25 + 0.75 * g0;
    const uj = makePlantGroup(p, i, g0, ujEvszak, (p.h ?? spec.h) * k, (p.d ?? spec.d) * k);
    setOpacity(uj, 0);

  const utemez = (fn) => (document.hidden ? setTimeout(fn, 16) : requestAnimationFrame(fn));
  (function step() {
    const t = Math.min(1, (performance.now() - t0) / dur);
    const e = t * t * (3 - 2 * t);                            // lágy be/kifutás
    parok.forEach(([r, u]) => { setOpacity(r, 1 - e); setOpacity(u, e); });
    renderer.render(scene, camera);                            // az átúsztatás alatt folyamatos kép
    if (t < 1 && fadeParok === parok) return utemez(step);
    if (fadeParok === parok) fadeLezar();
    needsShadow = true; render();
  })();

function buildPlants(growth) {

function flatten(group, name) {
  group.updateMatrixWorld(true);
  const byMat = new Map();
  group.traverse((o) => {
    if (!o.isMesh) return;
    const key = o.material.uuid;
    if (!byMat.has(key)) byMat.set(key, { mat: o.material, geos: [] });
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    byMat.get(key).geos.push(g);
  });
  const out = new THREE.Group();
  out.name = name;
  byMat.forEach(({ mat, geos }) => {
    let total = 0;
    geos.forEach(g => total += g.attributes.position.count);
    const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
    let off = 0;
    geos.forEach(g => {
      pos.set(g.attributes.position.array, off * 3);
      if (g.attributes.normal) nor.set(g.attributes.normal.array, off * 3);
      off += g.attributes.position.count;
      g.dispose();
    });
    const merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    merged.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    merged.computeBoundingSphere();
    const m = new THREE.Mesh(merged, mat);
    m.name = name + '-' + mat.name;
    m.castShadow = true; m.receiveShadow = true;
    out.add(m);
  });

}

{

      g.rotation.y = (o.rot || 0) * Math.PI / 180;
      // belső csoport: a forgatott modellt középre tesszük, hosszra / mélységre méretezzük,
      // és a lejtés szerint elnyírjuk (y' = y + lejtes · x), hogy két ív közé pontosan beférjen
      const belso = new THREE.Group(); belso.add(g); belso.updateMatrixWorld(true);

      const bb = new THREE.Box3();

      if (bb.isEmpty()) bb.setFromObject(belso);
      g.position.x -= (bb.min.x + bb.max.x) / 2; g.position.z -= (bb.min.z + bb.max.z) / 2;
      const sx = o.hossz ? o.hossz / (bb.max.x - bb.min.x) : 1;
      const sz = o.melyseg ? o.melyseg / (bb.max.z - bb.min.z) : 1;

function applySun(month, hour) {
  const doy = Math.round((month - 0.5) * 30.44);
  const decl = (23.44 * Math.PI / 180) * Math.sin((2 * Math.PI * (284 + doy)) / 365);
  const H = ((hour - 13) * 15 * Math.PI) / 180;
  const alt = Math.asin(Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(H));
  let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(LAT) - Math.tan(decl) * Math.cos(LAT)) + Math.PI;
  const a = Math.max(alt, 0.04), rel = az - LOT_AZIMUTH, R = 95;
  const hxz = Math.cos(a) * R;
  sun.position.set(CX + Math.cos(rel) * hxz, Math.sin(a) * R + 2, -CY + Math.sin(rel) * hxz);
  sun.target.position.set(CX, min[2] + 2, -CY);
  sun.target.updateMatrixWorld();
  const dusk = THREE.MathUtils.clamp(alt / 0.5, 0, 1);
  sun.intensity = 0.3 + 2.3 * dusk;
  sun.color.setHSL(0.09 - 0.03 * dusk, 0.55 - 0.35 * dusk, 0.55 + 0.35 * dusk);
  needsShadow = true;
}

  document.querySelectorAll('.btns button[data-kutya]').forEach((b) => b.toggleAttribute('data-on', +b.dataset.kutya === i));
  kutyaKamera(1);
}
function kovetesVege() {
  if (kovetett === null) return;
  kutyak[kovetett].fej.visible = true;
  kovetett = null;
  controls.enabled = true;
  camera.near = 0.5; camera.updateProjectionMatrix();
  document.querySelectorAll('.btns button[data-kutya]').forEach((b) => b.removeAttribute('data-on'));
}
function kutyaKamera(lagy) {
  const k = kutyak[kovetett], c = Math.cos(k.irany), sn = Math.sin(k.irany);
  // szem: a fej helyén (0,45 m előre, 0,78 m magasan); cél: 4 m-rel előre, kicsit lejjebb
  _kSzem.set(k.x + c * 0.45, k.z + 0.78 + (k.test.position.y + 0.5), -(k.y + sn * 0.45));
  _kCel.set(k.x + c * 4.5, k.z + 0.45, -(k.y + sn * 4.5));
  camera.position.lerp(_kSzem, lagy);
  controls.target.lerp(_kCel, lagy);
  camera.lookAt(controls.target);
}
document.querySelectorAll('.btns button[data-kutya]').forEach((b) =>
  b.addEventListener('click', () => (kovetett === +b.dataset.kutya ? (kovetesVege(), goView('terasz'), tick()) : kovetesIndul(+b.dataset.kutya))));
document.querySelectorAll('.btns button[data-view]').forEach((b) => b.addEventListener('click', kovetesVege));

let kUtolso = performance.now();
(function kutyaHurok(t) {
  // 30 kép/mp elég a kutyáknak: feleannyi rajzolás, a mozgás így is folyamatos
  if (t !== undefined && t - kUtolso < 1000 / 30 - 2) { requestAnimationFrame(kutyaHurok); return; }
  const dt = Math.min(0.05, ((t ?? performance.now()) - kUtolso) / 1000); kUtolso = t ?? performance.now();
  kutyaLepes(dt);
  if (kovetett !== null) kutyaKamera(Math.min(1, dt * 10));
  if (!rendering && !document.hidden) {
    if (needsShadow) { renderer.shadowMap.needsUpdate = true; needsShadow = false; }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(kutyaHurok);
})();

window.__scene = { scene, camera, world, plantGroup, sun, renderer, manifest, PLANTS,
                   kutyak: { lista: kutyak, lepes: kutyaLepes, mod: () => kMod, szaltozz, kovetesIndul, kovetesVege, kamera: () => kovetett !== null && kutyaKamera(1) } };
